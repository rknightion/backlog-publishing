name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # The site's only freshness mechanism. Trackers live in 24 other repositories
  # and none of them knows this site exists, which is the point: a new public
  # repo with a backlog/ directory is published without touching anything here.
  # The cost of that is polling.
  #
  # Every 6 hours, not hourly. Most of these trackers move a few times a week,
  # and each rebuild also announces its changes through IndexNow - hourly would
  # mean pinging search engines about tracker churn nobody is searching for.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One group for the whole repository, and never cancelled. Two deploys in
# flight would race over the same asset upload, and a cancelled one can leave
# the upload half-applied. A PR build publishes nothing, so it may cancel.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('backlogs-pr-{0}', github.event.pull_request.number)
        || 'backlogs-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the Node pin
        id: node
        run: awk -F '"' '/^node_version := / { print "version=" $2 }' justfile >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      # GitHub-hosted runners have no just, and only this side pins it. Never
      # add a second pin: whichever installs last wins on PATH, so a one-sided
      # bump would quietly make the other a lie.
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the project
        run: just setup

      # Reads only public repositories, so the job's own GITHUB_TOKEN is enough
      # and no credential is minted for this step.
      - name: Fetch every public tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: just fetch

      - name: Build, index and verify
        run: just check

      # After the build, so a camden outage does not burn the gate first: a
      # failure here is infrastructure, not the commit.
      - name: Read the deploy credential from OpenBao
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: rknightion/.github/.github/actions/bao-secret@06d6727487515cd6628e01696af6f886f1421e04
        with:
          role: backlogs-m7kni-io
          path: brewmdm/backlogs-m7kni-io
          # GitHub-hosted runners are not on the tailnet, so join it as an
          # ephemeral tag:gha node. Both inputs are identifiers, not secrets.
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      # One stable key: state persists across deploys instead of growing a new
      # cache entry every run. See the delete step below the save step.
      - name: Restore the IndexNow state
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .indexnow-state.json
          key: indexnow-state

      # AFTER the deploy: announcing a URL that is still serving the previous
      # build invites a crawl of content we just replaced. Never fails the run.
      - name: Announce changed pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: just indexnow

      # The zone, not this repository, decides whether an agent bridge script
      # is injected into every page. Nothing in dist/ can show it and no build
      # assertion can reach it, so this probes the live origin instead.
      # `continue-on-error` on purpose: a zone setting flipping back is worth
      # seeing on the run, and is not a reason to mark a good release failed.
      - name: Check the edge is not injecting an agent bridge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "https://backlogs.m7kni.io/.webmcp/bridge.js")
          if [ "$code" != "404" ]; then
            echo "::error::webmcp_enabled looks back on for the zone:" \
              "/.webmcp/bridge.js answered $code, expected 404." \
              "Turn it off again: PATCH /zones/{zone}/settings/webmcp_enabled {\"value\":\"off\"}," \
              "then purge the zone cache. Do NOT touch content_converter."
            exit 1
          fi
          echo "no agent bridge injected (bridge.js 404)"

      # Handed to save-indexnow-cache below: that job holds the only
      # actions:write grant, kept out of this job because it also runs
      # `npm ci` / `just check` against pull_request code.
      - name: Upload the IndexNow state
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexnow-state
          path: .indexnow-state.json
          # A dot-leading path is a hidden file; upload-artifact drops it silently otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # A separate job so only this one holds actions:write (needed to delete the
  # previous cache entry - a cache entry is immutable once written, and the
  # key below is stable rather than run-unique). Keeping that grant off the
  # `deploy` job matters because it runs `npm ci` / `just check` against
  # pull_request code, which never reaches this job (its `if:` mirrors the
  # steps in `deploy` that only run on a main push).
  save-indexnow-cache:
    name: Save the IndexNow state
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
    steps:
      - name: Download the IndexNow state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: indexnow-state

      # `gh cache list --key` matches by PREFIX, so it also returns the old
      # run-unique entries (indexnow-state-<run_id>-<attempt>) from before
      # this stable key existed. Filter to an exact key match before
      # deleting, and delete every match rather than assuming there is at
      # most one, so a real API/auth failure still fails the step instead of
      # being swallowed with the no-cache-found case.
      - name: Delete the previous IndexNow-state cache entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A plain `var=$(cmd)` assignment surfaces cmd's failure to this
          # script's `set -e`; `mapfile < <(cmd)` would not have.
          list_json=$(gh cache list --repo "${{ github.repository }}" --key indexnow-state --limit 100 --json key,id)
          ids=$(printf '%s' "$list_json" | jq -r '.[] | select(.key == "indexnow-state") | .id')
          if [ -z "$ids" ]; then
            echo "no previous indexnow-state cache entry to delete"
          else
            while IFS= read -r id; do
              gh cache delete "$id" --repo "${{ github.repository }}"
            done <<<"$ids"
          fi

      - name: Save the IndexNow state
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .indexnow-state.json
          key: indexnow-state

  # Required by the fleet's gated main ruleset. `deploy` never runs its
  # deploy/IndexNow steps on a pull_request (see the per-step `if:` guards
  # above), and save-indexnow-cache is legitimately skipped there too, so a
  # PR run still reports ci-success once the build/check steps pass.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy, save-indexnow-cache]
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
